<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative modular CMM fixturing concept</title>
  <desc id="desc">Technical line illustration of a perforated fixture plate with adjustable supports. This is a conceptual diagram, not an image or specification of an available Haviss product.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef2f7"/><stop offset="1" stop-color="#dce5f1"/></linearGradient>
    <linearGradient id="plate" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#bbc9da"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#0b1730" stroke-opacity=".055"/></pattern>
    <pattern id="holes" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="6" fill="#0b1730" opacity=".75"/><circle cx="28" cy="28" r="2" fill="#fff" opacity=".4"/></pattern>
  </defs>
  <path fill="url(#bg)" d="M0 0h1200v900H0z"/><path fill="url(#grid)" d="M0 0h1200v900H0z"/>
  <g transform="translate(600 460)">
    <path d="M-460 0 0-225 460 0 0 245z" fill="#90a3ba" opacity=".14" transform="translate(10 85)"/>
    <path d="M-450 0 0-225 450 0v40L0 265-450 40z" fill="#879bb5" stroke="#617892" stroke-width="2"/>
    <path d="M0 225v40l450-225V0z" fill="#7188a4"/>
    <path d="M-450 0 0-225 450 0 0 225z" fill="url(#plate)" stroke="#e6edf5" stroke-width="2"/>
    <g transform="matrix(.75 .375 -.75 .375 0 -225)"><path d="M0 0h600v600H0z" fill="url(#holes)"/></g>
    <g fill="#1464f4" stroke="#0e4eba" stroke-width="2">
      <path d="M-240-15v-120l25-13 25 13v120l-25 13z"/><ellipse cx="-215" cy="-135" rx="25" ry="13" fill="#b0d0ff"/>
      <path d="M95-120v-120l25-13 25 13v120l-25 13z"/><ellipse cx="120" cy="-240" rx="25" ry="13" fill="#b0d0ff"/>
      <path d="M110 100V-20l25-13 25 13v120l-25 13z"/><ellipse cx="135" cy="-20" rx="25" ry="13" fill="#b0d0ff"/>
    </g>
    <path d="M-235-154 85-310 260-220-60-60z" fill="#e4eaf2" fill-opacity=".82" stroke="#2c4a70" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M-235-154v25L-60-40 260-195v-25M-60-60v20" fill="none" stroke="#2c4a70" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
  <g fill="none" stroke="#1464f4" stroke-width="1.5"><path d="M160 320H295L390 375M1000 255H895L735 220M1000 675H900L795 580"/><circle cx="390" cy="375" r="5" fill="#1464f4"/><circle cx="735" cy="220" r="5" fill="#1464f4"/><circle cx="795" cy="580" r="5" fill="#1464f4"/></g>
  <g font-family="Arial,sans-serif" font-size="18" letter-spacing="2" fill="#415773"><text x="100" y="302">ADJUSTABLE SUPPORTS</text><text x="880" y="237">WORKPIECE</text><text x="910" y="705">FIXTURE PLATE</text></g>
  <text x="65" y="825" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#64748b">ILLUSTRATIVE CONCEPT · CONFIGURATION DEPENDS ON YOUR PART</text>
</svg>
