# Render Blueprint: deploys the prerendered site as a free static site.
# In Render: New + > Blueprint > pick this repository > Apply.
# Public build settings (Supabase URL/anon key, VITE_SITE_URL) come from the committed .env.production.
services:
  - type: web
    name: haviss
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /admin*
        name: Cache-Control
        value: no-store
      - path: /admin*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      # Equipment detail pages are rendered in the browser from the database.
      - type: rewrite
        source: /products/equipment/*
        destination: /index.html
